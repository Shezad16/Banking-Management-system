<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - SwiftPay</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../CSS/style.css"
    >

</head>


<body class="dashboard-body">


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary fs-3"
            href="dashboard.html"
        >

            <i class="fa-solid fa-wallet"></i>

            SwiftPay

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#dashboardNav"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="dashboardNav"
        >

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="dashboard.html"
                    >
                        Dashboard
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="banking.html"
                    >
                        Banking
                    </a>

                </li>


                <li class="nav-item">

                    <span
                        id="navUserName"
                        class="nav-link fw-semibold"
                    >
                    </span>

                </li>


                <li class="nav-item">

                    <button
                        id="logoutBtn"
                        class="btn btn-outline-danger"
                    >

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </button>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main class="container py-5">


    <!-- WELCOME -->

    <div class="mb-4">

        <p class="text-muted mb-1">
            Welcome back,
        </p>

        <h2 id="welcomeUser">
            User
        </h2>

    </div>


    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="row g-4 mb-5">


        <!-- BALANCE -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon">

                    <i class="fa-solid fa-wallet"></i>

                </div>

                <p>Balance</p>

                <h3 id="balanceAmount">
                    ₹0.00
                </h3>

            </div>

        </div>


        <!-- DEPOSITS -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon success">

                    <i class="fa-solid fa-arrow-down"></i>

                </div>

                <p>Total Deposits</p>

                <h3 id="totalDeposits">
                    ₹0.00
                </h3>

            </div>

        </div>


        <!-- WITHDRAWALS -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon danger">

                    <i class="fa-solid fa-arrow-up"></i>

                </div>

                <p>Total Withdrawals</p>

                <h3 id="totalWithdrawals">
                    ₹0.00
                </h3>

            </div>

        </div>


        <!-- TRANSACTIONS -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon purple">

                    <i class="fa-solid fa-receipt"></i>

                </div>

                <p>Transactions</p>

                <h3 id="transactionCount">
                    0
                </h3>

            </div>

        </div>

    </div>


    <!-- =========================
         QUICK ACTIONS
    ========================= -->

    <div class="section-card mb-5">

        <h4 class="mb-4">
            Quick Actions
        </h4>


        <div class="row g-3">


            <div class="col-md-4">

                <a
                    href="banking.html#deposit"
                    class="quick-action"
                >

                    <i class="fa-solid fa-circle-plus"></i>

                    <span>
                        Deposit Money
                    </span>

                </a>

            </div>


            <div class="col-md-4">

                <a
                    href="banking.html#withdraw"
                    class="quick-action"
                >

                    <i class="fa-solid fa-money-bill-transfer"></i>

                    <span>
                        Withdraw Money
                    </span>

                </a>

            </div>


            <div class="col-md-4">

                <a
                    href="banking.html#transactions"
                    class="quick-action"
                >

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span>
                        View Transactions
                    </span>

                </a>

            </div>

        </div>

    </div>


    <!-- =========================
         RECENT TRANSACTIONS
    ========================= -->

    <div class="section-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h4 class="mb-0">
                Recent Transactions
            </h4>

            <a href="banking.html#transactions">
                View All
            </a>

        </div>


        <div id="recentTransactions">

        </div>

    </div>


</main>


<!-- Toast -->

<div id="toastContainer"></div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =========================
     JAVASCRIPT
========================= -->

<!-- Common functions FIRST -->
<script src="../JavaScript/app.js"></script>

<!-- Authentication -->
<script src="../JavaScript/auth.js"></script>

<!-- Transaction functions -->
<script src="../JavaScript/transaction.js"></script>


</body>

</html>
