<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Banking - SwiftPay</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    
    <link rel="stylesheet" href="../CSS/style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary fs-3"
            href="dashboard.html"
        >

            <i class="fa-solid fa-wallet"></i>
            SwiftPay

        </a>


        <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#bankingNav"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="bankingNav">

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="dashboard.html"
                    >
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link active"
                        href="banking.html"
                    >
                        Banking
                    </a>
                </li>

                <li class="nav-item">
                    <span
                        id="navUserName"
                        class="nav-link fw-semibold">
                    </span>
                </li>

                <li class="nav-item">

                    <button
                        id="logoutBtn"
                        class="btn btn-outline-danger"
                    >

                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout

                    </button>

                </li>

            </ul>

        </div>

    </div>

</nav>


<main class="container py-5">


    <div class="mb-5">

        <p class="text-muted mb-1">
            Banking Services
        </p>

        <h2>
            Manage Your Money
        </h2>

    </div>


    <!-- BALANCE -->

    <div class="balance-banner mb-5">

        <div>

            <p class="mb-1">
                Available Balance
            </p>

            <h1 id="bankBalance">
                ₹0.00
            </h1>

        </div>


        <i class="fa-solid fa-wallet"></i>

    </div>


    <div class="row g-4">


        <!-- DEPOSIT -->

        <div class="col-lg-6" id="deposit">

            <div class="form-card">

                <div class="form-heading">

                    <div class="transaction-icon credit">
                        <i class="fa-solid fa-arrow-down"></i>
                    </div>

                    <div>
                        <h4>Deposit Money</h4>
                        <p>Add money to your account</p>
                    </div>

                </div>


                <form id="depositForm">

                    <label class="form-label">
                        Amount
                    </label>

                    <div class="input-group mb-3">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            id="depositAmount"
                            class="form-control"
                            min="1"
                            step="0.01"
                            placeholder="Enter amount"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >

                        <i class="fa-solid fa-plus"></i>
                        Deposit

                    </button>

                </form>

            </div>

        </div>


        <!-- WITHDRAW -->

        <div class="col-lg-6" id="withdraw">

            <div class="form-card">

                <div class="form-heading">

                    <div class="transaction-icon debit">
                        <i class="fa-solid fa-arrow-up"></i>
                    </div>

                    <div>
                        <h4>Withdraw Money</h4>
                        <p>Withdraw money from your account</p>
                    </div>

                </div>


                <form id="withdrawForm">

                    <label class="form-label">
                        Amount
                    </label>

                    <div class="input-group mb-3">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            id="withdrawAmount"
                            class="form-control"
                            min="1"
                            step="0.01"
                            placeholder="Enter amount"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-danger w-100"
                    >

                        <i class="fa-solid fa-minus"></i>
                        Withdraw

                    </button>

                </form>

            </div>

        </div>


    </div>


    <!-- TRANSACTIONS -->

    <section id="transactions" class="section-card mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h4>
                    Transaction History
                </h4>

                <p class="text-muted mb-0">
                    Search and filter your transactions
                </p>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="row g-3 mb-4">

            <div class="col-md-6">

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="fa-solid fa-search"></i>
                    </span>

                    <input
                        type="text"
                        id="transactionSearch"
                        class="form-control"
                        placeholder="Search transactions..."
                    >

                </div>

            </div>


            <div class="col-md-3">

                <select
                    id="transactionFilter"
                    class="form-select"
                >

                    <option value="all">
                        All Transactions
                    </option>

                    <option value="credit">
                        Credit
                    </option>

                    <option value="debit">
                        Debit
                    </option>

                </select>

            </div>


            <div class="col-md-3">

                <button
                    id="clearFilters"
                    class="btn btn-outline-secondary w-100"
                >

                    Clear Filters

                </button>

            </div>

        </div>


        <div id="transactionList">

        </div>


    </section>


</main>


<div id="toastContainer"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../JavaScript/app.js"></script>
<script src="../JavaScript/auth.js"></script>
<script src="../JavaScript/banking.js"></script>
<script src="../JavaScript/transaction.js"></script>

</body>

</html>
