<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinBank - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS is outside banking-app folder -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="auth-body">

        <div class="auth-container">

            <div class="auth-card">

            <h1 class="text-center fw-bold">
                FinBank
            </h1>

            <p class="text-center auth-subtitle">
                Login to your account
            </p>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="mb-4">

                    <label
                        for="loginEmail"
                        class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-4">

                    <label
                        for="loginPassword"
                        class="form-label">

                        Password

                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="btn btn-primary w-100">

                    Login

                </button>

            </form>


            <p class="text-center mt-4">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>
    </div>


    <!-- JavaScript is outside banking-app folder -->

    <script src="../JavaScript/app.js"></script>
    <script src="../JavaScript/auth.js"></script>

</body>

</html>
