<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - SwiftPay</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- IMPORTANT:
         CSS folder is outside banking-app -->

    <link
        rel="stylesheet"
        href="../CSS/style.css"
    >

</head>


<body class="auth-body">


    <div class="auth-container">

        <div class="auth-card">


            <!-- Logo / Heading -->

            <div class="text-center mb-4">

                <a
                    href="../index.html"
                    class="auth-logo"
                >

                    <i class="fa-solid fa-wallet"></i>

                    SwiftPay

                </a>


                <h2>
                    Create Account
                </h2>


                <p class="text-muted">
                    Create your SwiftPay account
                </p>

            </div>



            <!-- Signup Form -->

            <form id="signupForm">


                <!-- Full Name -->

                <div class="mb-3">

                    <label
                        for="signupName"
                        class="form-label"
                    >

                        Full Name

                    </label>


                    <input
                        type="text"
                        id="signupName"
                        class="form-control"
                        placeholder="Enter full name"
                        required
                    >

                </div>



                <!-- Email -->

                <div class="mb-3">

                    <label
                        for="signupEmail"
                        class="form-label"
                    >

                        Email

                    </label>


                    <input
                        type="email"
                        id="signupEmail"
                        class="form-control"
                        placeholder="Enter email"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="mb-3">

                    <label
                        for="signupPassword"
                        class="form-label"
                    >

                        Password

                    </label>


                    <input
                        type="password"
                        id="signupPassword"
                        class="form-control"
                        placeholder="Create password"
                        required
                    >

                </div>



                <!-- Confirm Password -->

                <div class="mb-4">

                    <label
                        for="signupConfirmPassword"
                        class="form-label"
                    >

                        Confirm Password

                    </label>


                    <input
                        type="password"
                        id="signupConfirmPassword"
                        class="form-control"
                        placeholder="Confirm password"
                        required
                    >

                </div>



                <!-- Submit -->

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >

                    Create Account

                </button>

            </form>



            <!-- Login Link -->

            <p class="text-center mt-4">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </div>



    <!-- Toast Container -->

    <div id="toastContainer"></div>



    <!-- IMPORTANT:
         JavaScript folder is outside banking-app -->

    <script src="../JavaScript/app.js"></script>

    <script src="../JavaScript/auth.js"></script>


</body>

</html>
